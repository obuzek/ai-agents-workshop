# Orchestrate key-value connection holding the EHR API's base_url and your
# tenant ID. deploy.py imports it and sets both values from .env; tools.py
# reads them with connections.key_value("lakeview_ehr").
spec_version: v1
kind: connection
app_id: lakeview_ehr
environments:
  draft:
    kind: key_value
    type: team
  live:
    kind: key_value
    type: team

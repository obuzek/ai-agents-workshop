name: Deploy Documentation

# /oss/ is built from main; /ibm/ is built from txc-2026-ibm, the branch IBM-edition
# attendees clone, so the guide always matches the code it describes.
on:
  push:
    branches:
      - main
      - txc-2026-ibm
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

# Pushes to main and txc-2026-ibm both publish the whole site; run them one at a time.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (open-source edition, build scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # Fetch all history for git info plugins

      - name: Checkout txc-2026-ibm (IBM edition)
        uses: actions/checkout@v4
        with:
          ref: txc-2026-ibm
          path: ibm-branch
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install MkDocs as a uv tool
        run: |
          uv tool install "mkdocs==1.6.1" \
            --with "mkdocs-material==9.7.7" \
            --with "pymdown-extensions==12.3" \
            --with "mkdocs-revealjs==0.12.0" \
            --with "mkdocs-awesome-pages-plugin==2.10.1" \
            --with "mkdocs-git-revision-date-localized-plugin==1.5.1" \
            --with "mkdocs-git-authors-plugin==0.10.0" \
            --with "mkdocs-glightbox==0.5.2" \
            --with "mkdocs-minify-plugin==0.8.0" \
            --with "mkdocs-rss-plugin==1.18.0" \
            --with "mkdocs-table-reader-plugin==3.1.0"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build all editions
        run: IBM_DOCS_DIR="$GITHUB_WORKSPACE/ibm-branch/docs/ibm" docs/build.sh

      # mkdocs gh-deploy only publishes a single site, so push the combined build directly.
      - name: Deploy to GitHub Pages
        run: |
          uvx ghp-import==2.1.0 --no-jekyll --push --force --remote origin \
            --branch gh-pages --message "Deploy docs (triggered by ${{ github.ref_name }} @ ${{ github.sha }})" docs/site

      - name: Summary
        run: |
          echo "✅ Documentation deployed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 Open-source edition: https://obuzek.github.io/ai-agents-workshop/oss/" >> $GITHUB_STEP_SUMMARY
          echo "🌐 IBM edition: https://obuzek.github.io/ai-agents-workshop/ibm/" >> $GITHUB_STEP_SUMMARY
          echo "📝 Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
